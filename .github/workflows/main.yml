name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 340

    steps:
      - name: Configure RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force
        shell: powershell

      - name: Configure RDP user from secret
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if (-not $env:RDP_PASSWORD) { Write-Error "RDP_PASSWORD secret missing"; exit 1 }
          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "runneradmin" -Password $securePass
          } else {
            New-LocalUser -Name "runneradmin" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue
        shell: powershell

      - name: Install Tailscale
        run: choco install tailscale -y
        shell: powershell

      - name: Connect Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TAILSCALE_AUTH_KEY) { Write-Error "TAILSCALE_AUTH_KEY secret missing"; exit 1 }
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $tailscale up --authkey="$env:TAILSCALE_AUTH_KEY" --hostname="gh-rdp-$env:GITHUB_RUN_ID"
          $tsIP = $null
          for ($i = 1; $i -le 12; $i++) {
            Start-Sleep -Seconds 5
            $tsIP = (& $tailscale ip -4 2>$null | Select-Object -First 1).Trim()
            if ($tsIP) { break }
          }
          if (-not $tsIP) { Write-Error "Tailscale IP was not assigned."; exit 1 }
          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
        shell: powershell

      - name: Verify RDP
        run: |
          Write-Host "Testing RDP on $env:TAILSCALE_IP..."
          $result = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -InformationLevel Quiet
          if (-not $result) { Write-Error "RDP port 3389 is not reachable."; exit 1 }
          Write-Host "RDP connection is ready."
        shell: powershell

      - name: Show RDP Details
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "       RDP - TAILSCALE"
          Write-Host "========================================"
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : runneradmin"
          Write-Host "Password : the one in your RDP_PASSWORD secret"
          Write-Host "========================================"
          Write-Host ""
        shell: powershell

      - name: Keep RDP Alive
        run: |
          while ($true) {
            Write-Host "[$(Get-Date)] RDP is active - cancel workflow to stop"
            Start-Sleep -Seconds 300
          }
        shell: powershell
